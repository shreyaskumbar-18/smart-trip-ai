{% extends 'base.html' %}{% block title %}Assistant{% endblock %}{% block content %}<h2>Trip Assistant</h2><div class="card p-3 mb-3">{% for c in chat %}<p><strong>{{ c.role|title }}:</strong> {{ c.text }}</p>{% empty %}<p>Ask about your budget, itinerary, weather or progress.</p>{% endfor %}</div><form method="post">{% csrf_token %}<div class="input-group"><input class="form-control" name="message" placeholder="Ask something about this trip"><button class="btn btn-primary">Send</button></div></form><form method="post" class="mt-2">{% csrf_token %}<input type="hidden" name="action" value="clear"><button class="btn btn-outline-secondary">Clear chat</button></form>{% endblock %}
