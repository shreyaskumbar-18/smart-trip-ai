{% extends "travel/base.html" %}{% block content %}<div class="container py-5"><div class="planner-card mx-auto"><h1>Group Trip Planning</h1><p>Invite registered users to collaborate on the trip.</p><p><b>Invite code:</b> {{group.invite_code}}</p><form method="post">{% csrf_token %}<input class="form-control mb-3" name="username" placeholder="Registered username"><button class="btn btn-primary">Add member</button></form><hr><h5>Members</h5>{% for m in group.members.all %}<div>{{m.username}}</div>{% empty %}<p>No members yet.</p>{% endfor %}</div></div>{% endblock %}
