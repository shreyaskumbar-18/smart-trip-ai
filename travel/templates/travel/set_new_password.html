{% extends "travel/base.html" %}
{% block title %}Set New Password | SmartTrip AI{% endblock %}

{% block content %}
<section class="section pt-5 pb-5">
    <div class="container-xl auth-wrap">
        <div class="auth-card mx-auto shadow-sm" style="max-width: 460px; width: 100%;">
            <div class="text-center mb-4">
                <span class="eyebrow">Security Update</span>
                <h1 class="h3 fw-bold mb-1">Set a new password</h1>
                <p class="muted small mb-0">Choose a strong password containing at least 8 characters.</p>
            </div>

            <form method="post" class="mt-3">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="new-password">New Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
                        <input id="new-password" class="form-control border-start-0 ps-0" type="password" name="password1" minlength="8" required placeholder="Enter new password" autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" for="confirm-password">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-shield-halved"></i></span>
                        <input id="confirm-password" class="form-control border-start-0 ps-0" type="password" name="password2" minlength="8" required placeholder="Repeat new password">
                    </div>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold">
                        <i class="fa-solid fa-key me-2"></i>Update Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
