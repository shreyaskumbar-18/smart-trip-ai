{% extends "travel/base.html" %}{% block content %}<div class="container py-5"><h1>Destinations</h1><form class="row g-2 my-4"><div class="col-md-8"><input class="form-control" name="q" value="{{q}}" placeholder="Search"></div><div class="col-md-2"><input class="form-control" name="interest" value="{{interest}}" placeholder="Interest"></div><div class="col-md-2"><button class="btn btn-dark w-100">Search</button></div></form><div class="row g-4">{% for d in destinations %}<div class="col-md-6 col-lg-4"><div class="card destination-card h-100"><img src="{{d.image_url}}" class="card-img-top"><div class="card-body"><h4>{{d.name}}</h4><p>{{d.description}}</p><div class="small text-muted">★ {{d.rating}} · Sustainability {{d.sustainability_score}} · Hidden gem {{d.hidden_gem_score}}</div><a class="btn btn-outline-dark mt-3" href="{% url 'destination_detail' d.pk %}">Details</a></div></div></div>{% empty %}<p>No results.</p>{% endfor %}</div></div>{% endblock %}
