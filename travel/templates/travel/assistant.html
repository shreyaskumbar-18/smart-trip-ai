{% extends "travel/base.html" %}{% block content %}<div class="container py-5"><div class="assistant-box mx-auto"><h1>SmartTrip Assistant</h1><p>Ask about recommendations, weather, budget, group trips, explanations or what-if planning.</p>{% if answer %}<div class="chat-answer mb-4"><b>Assistant:</b><p class="mb-0">{{answer}}</p></div>{% endif %}<form method="post">{% csrf_token %}<div class="input-group"><input class="form-control" name="question" placeholder="Why was this place recommended?" required><button class="btn btn-primary">Ask</button></div></form></div></div>{% endblock %}
